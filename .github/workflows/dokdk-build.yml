# Publishes a dokdk build: the packages of the chosen branch, versioned 0.0.0-dokdk-<timestamp>,
# built, tested and packed by scripts/dokdk-build.sh, as a GitHub pre-release with the tarballs.
# Run it from the Actions tab; DOKDK.md says how to use the result.
name: dokdk build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dokdk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version, build, test and pack
        run: scripts/dokdk-build.sh "$RUNNER_TEMP/dokdk-build"

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/dokdk-build"
          version="$(cat "$out/VERSION")"
          gh release create "v$version" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "dokdk build $version" \
            --notes-file "$out/release-notes.md" \
            "$out"/*.tgz "$out/SHA256SUMS"
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/v$version" >>"$GITHUB_STEP_SUMMARY"
